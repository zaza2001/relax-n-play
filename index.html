<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>სიტყვების გამოცნობა - Multiplayer</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Font: Fira GO for Georgian text -->
  <link href="https://fonts.googleapis.com/css2?family=Fira+GO:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Fira GO', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      min-height: 100vh;
      color: #f8fafc;
    }
    .glass-panel {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .card-tile {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card-tile:hover:not(:disabled) {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
    }
  </style>
</head>
<body class="flex flex-col min-h-screen">

  <div id="app" class="flex-grow flex flex-col justify-center items-center p-3 md:p-6 max-w-4xl mx-auto w-full">
    
    <!-- Header -->
    <header class="text-center mb-6 w-full">
      <h1 class="text-3xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-300 to-pink-400 mb-2">
        <i class="fa-solid font-bold fa-font-awesome mr-2"></i>სიტყვების თამაში
      </h1>
      <p class="text-xs md:text-sm text-slate-400">ითამაშე მეგობართან ერთად რეალურ დროში</p>
    </header>

    <!-- Notification Toast -->
    <div id="toast" class="hidden fixed top-4 right-4 left-4 md:left-auto md:w-96 glass-panel border-l-4 border-indigo-500 p-4 rounded-xl shadow-2xl z-50 text-sm flex items-center justify-between transition-all duration-300">
      <div id="toast-message" class="text-slate-200"></div>
      <button onclick="hideToast()" class="text-slate-400 hover:text-white ml-2"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <!-- Lobby / Room Joining Screen -->
    <div id="lobby-screen" class="w-full max-w-md glass-panel p-6 md:p-8 rounded-3xl shadow-2xl text-center">
      <div class="mb-8">
        <div class="w-16 h-16 bg-indigo-600/30 text-indigo-400 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl border border-indigo-500/30">
          <i class="fa-solid fa-gamepad"></i>
        </div>
        <h2 class="text-2xl font-bold mb-1">ონლაინ რეჟიმი</h2>
        <p class="text-sm text-slate-400">შეიყვანეთ კოდი ან შექმენით ახალი ოთახი</p>
      </div>

      <!-- Actions -->
      <div class="space-y-4">
        <button onclick="createRoom()" class="w-full py-4 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 font-bold rounded-2xl shadow-lg transition-all flex items-center justify-center text-lg active:scale-95">
          <i class="fa-solid fa-plus-circle mr-2"></i>ოთახის შექმნა
        </button>

        <div class="relative flex py-2 items-center">
          <div class="flex-grow border-t border-slate-700"></div>
          <span class="flex-shrink mx-4 text-slate-500 text-xs font-semibold uppercase tracking-wider">ან</span>
          <div class="flex-grow border-t border-slate-700"></div>
        </div>

        <div class="space-y-2">
          <input type="text" id="room-code-input" maxlength="4" placeholder="4-ნიშნა კოდი" class="w-full px-4 py-3 bg-slate-800/80 border border-slate-700 rounded-2xl text-center text-xl tracking-widest uppercase font-mono focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20">
          <button onclick="joinRoom()" class="w-full py-3 bg-slate-800 hover:bg-slate-700 font-bold rounded-2xl border border-slate-700 transition-all flex items-center justify-center active:scale-95">
            <i class="fa-solid fa-right-to-bracket mr-2"></i>ოთახში შესვლა
          </button>
        </div>
      </div>
    </div>

    <!-- Waiting Screen -->
    <div id="waiting-screen" class="hidden w-full max-w-md glass-panel p-8 rounded-3xl shadow-2xl text-center">
      <div class="animate-bounce w-16 h-16 bg-amber-500/20 text-amber-400 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl border border-amber-500/30">
        <i class="fa-solid fa-user-clock"></i>
      </div>
      <h2 class="text-2xl font-bold mb-2">ოთახი შექმნილია!</h2>
      <p class="text-sm text-slate-400 mb-6">გაუზიარეთ ეს კოდი მეორე მოთამაშეს:</p>

      <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-700 mb-6 flex items-center justify-between">
        <span id="display-room-code" class="text-3xl font-mono font-bold tracking-widest text-indigo-400">----</span>
        <button onclick="copyRoomCode()" class="p-2 hover:bg-slate-800 rounded-xl text-slate-400 hover:text-white transition-colors" title="კოდის კოპირება">
          <i class="fa-regular fa-copy text-xl"></i>
        </button>
      </div>

      <div class="flex items-center justify-center space-x-2 text-slate-400 text-sm">
        <div class="w-2 h-2 bg-amber-400 rounded-full animate-ping"></div>
        <span>ველით მეორე მოთამაშეს...</span>
      </div>
    </div>

    <!-- Main Game Board Screen -->
    <div id="game-screen" class="hidden w-full flex flex-col space-y-4">
      
      <!-- Status & Score Bar -->
      <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
        <!-- Player 1 Score -->
        <div id="p1-card" class="glass-panel p-3 md:p-4 rounded-2xl flex items-center justify-between border-l-4 border-indigo-500">
          <div>
            <div class="text-xs text-slate-400 font-semibold" id="p1-label">მოთამაშე 1</div>
            <div id="p1-score" class="text-xl md:text-2xl font-bold text-indigo-400">0 ქულა</div>
          </div>
          <i class="fa-solid fa-user text-indigo-400/40 text-2xl"></i>
        </div>

        <!-- Player 2 Score -->
        <div id="p2-card" class="glass-panel p-3 md:p-4 rounded-2xl flex items-center justify-between border-l-4 border-pink-500">
          <div>
            <div class="text-xs text-slate-400 font-semibold" id="p2-label">მოთამაშე 2</div>
            <div id="p2-score" class="text-xl md:text-2xl font-bold text-pink-400">0 ქულა</div>
          </div>
          <i class="fa-solid fa-user-group text-pink-400/40 text-2xl"></i>
        </div>

        <!-- Turn Indicator Header -->
        <div class="col-span-2 md:col-span-1 glass-panel p-3 md:p-4 rounded-2xl flex items-center justify-between border-l-4 border-amber-500">
          <div>
            <div class="text-xs text-slate-400 font-semibold">სვლის სტატუსი</div>
            <div id="turn-banner" class="text-sm md:text-base font-bold text-amber-400">იტვირთება...</div>
          </div>
          <i class="fa-solid fa-hourglass-half text-amber-400/40 text-2xl"></i>
        </div>
      </div>

      <!-- Active Selected Word Display & Input -->
      <div class="glass-panel p-4 md:p-6 rounded-3xl text-center space-y-4">
        <div class="text-xs font-bold text-indigo-400 uppercase tracking-widest">არჩეული ბარათი</div>
        <div id="masked-word-display" class="text-2xl md:text-4xl font-mono font-extrabold tracking-widest text-slate-300 min-h-[48px] flex items-center justify-center">
          აირჩიეთ ბარათი ქვემოთ
        </div>
        <div id="word-category-display" class="text-xs text-slate-400 italic"></div>

        <!-- Guess Input Area -->
        <div id="guess-controls" class="flex flex-col sm:flex-row gap-2 max-w-lg mx-auto pt-2 hidden">
          <input type="text" id="guess-input" placeholder="ჩაწერეთ სრული სიტყვა..." class="flex-grow px-4 py-3 bg-slate-800 border border-slate-700 rounded-2xl text-center sm:text-left focus:outline-none focus:border-indigo-500 text-lg">
          <button onclick="submitGuess()" class="px-6 py-3 bg-emerald-600 hover:bg-emerald-500 font-bold rounded-2xl shadow-lg transition-all flex items-center justify-center active:scale-95">
            <i class="fa-solid fa-check mr-2"></i>გამოცნობა
          </button>
        </div>
      </div>

      <!-- Grid of Cards -->
      <div id="cards-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 md:gap-4 py-2">
        <!-- Cards generated dynamically -->
      </div>

      <!-- Reset / New Game Button -->
      <div class="text-center pt-2">
        <button onclick="resetGame()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white rounded-xl text-xs font-semibold transition-all">
          <i class="fa-solid fa-rotate-right mr-1"></i>თამაშის თავიდან დაწყება
        </button>
      </div>

    </div>

  </div>

  <!-- Firebase Integration Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    // Standard fallback or embedded Firebase Config
  const firebaseConfig = {
  apiKey: "AIzaSyCcRzuTSNoomOKf4MC7sFRqwO8CAc2zfsw",
  authDomain: "word-game-b362f.firebaseapp.com",
  projectId: "word-game-b362f",
  storageBucket: "word-game-b362f.firebasestorage.app",
  messagingSenderId: "211112101325",
  appId: "1:211112101325:web:c001476b9ac5b3f529b084",
  measurementId: "G-XPCCCCDKS3"
};

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'georgian-words-app';

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
const auth = getAuth(app);

signInAnonymously(auth)
  .then(() => {
    console.log("წარმატებით შევიდა ანონიმურად!");
  })
  .catch((error) => {
    console.error("ავტორიზაციის შეცდომა:", error.code, error.message);
  });
    // Words collection in Georgian
    const WORDS_LIST = [
      { word: "დათვი", category: "ცხოველი" },
      { word: "მგელი", category: "ცხოველი" },
      { word: "ვეფხვი", category: "ცხოველი" },
      { word: "მზე", category: "ბუნება" },
      { word: "მთვარე", category: "ბუნება" },
      { word: "კომპიუტერი", category: "ტექნიკა" },
      { word: "ტელეფონი", category: "ტექნიკა" },
      { word: "წიგნი", category: "განათლება" },
      { word: "მანქანა", category: "ტრანსპორტი" },
      { word: "თვითმფრინავი", category: "ტრანსპორტი" },
      { word: "ვაშლი", category: "ხილი" },
      { word: "საზამთრო", category: "ხილი" }
    ];

    // Local State
    let currentUser = null;
    let roomCode = null;
    let playerRole = null; // 'player1' or 'player2'
    let roomUnsubscribe = null;
    let gameState = null;

    // Toast Notification helper
    window.showToast = function(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-message').innerText = msg;
      toast.classList.remove('hidden');
      setTimeout(() => { hideToast(); }, 4000);
    };

    window.hideToast = function() {
      document.getElementById('toast').classList.add('hidden');
    };

    // Authenticate user anonymously first
    async function initAuth() {
      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          const res = await signInWithCustomToken(auth, __initial_auth_token);
          currentUser = res.user;
        } else {
          const res = await signInAnonymously(auth);
          currentUser = res.user;
        }
      } catch (err) {
        console.error("Auth error:", err);
      }
    }

    // Generate random 4-digit numeric code
    function generateCode() {
      return Math.floor(1000 + Math.random() * 9000).toString();
    }

    // Mask word (e.g. "დათვი" -> "დ***ი")
    function maskWord(word) {
      if (!word) return "";
      if (word.length <= 2) return word;
      const first = word[0];
      const last = word[word.length - 1];
      const middle = "*".repeat(word.length - 2);
      return `${first}${middle}${last}`;
    }

    // Get Firestore room reference
    function getRoomRef(code) {
      return doc(db, 'artifacts', appId, 'public', 'data', 'rooms', code);
    }

    // Create a new Room
    window.createRoom = async function() {
      if (!currentUser) await initAuth();
      if (!currentUser) return showToast("ავტორიზაციის შეცდომა");

      roomCode = generateCode();
      playerRole = 'player1';

      // Pick 8 random words
      const shuffled = [...WORDS_LIST].sort(() => 0.5 - Math.random());
      const selectedWords = shuffled.slice(0, 8);

      const cards = selectedWords.map((item, index) => ({
        id: index,
        word: item.word,
        category: item.category,
        masked: maskWord(item.word),
        isRevealed: false,
        isGuessed: false,
        guessedBy: null
      }));

      const initialRoomData = {
        code: roomCode,
        player1: currentUser.uid,
        player2: null,
        currentTurn: 'player1',
        activeCardId: null,
        p1Score: 0,
        p2Score: 0,
        cards: cards,
        status: 'waiting', // waiting, playing, finished
        createdAt: new Date().toISOString()
      };

      try {
        await setDoc(getRoomRef(roomCode), initialRoomData);
        document.getElementById('display-room-code').innerText = roomCode;
        switchScreen('waiting-screen');
        listenToRoom(roomCode);
      } catch (err) {
        console.error("Error creating room:", err);
        showToast("ოთახის შექმნა ვერ მოხერხდა");
      }
    };

    // Join Existing Room
    window.joinRoom = async function() {
      if (!currentUser) await initAuth();
      const codeInput = document.getElementById('room-code-input').value.trim();
      if (codeInput.length !== 4) {
        return showToast("შეიყვანეთ ვალიდური 4-ნიშნა კოდი");
      }

      roomCode = codeInput;
      const ref = getRoomRef(roomCode);

      try {
        const snap = await getDoc(ref);
        if (!snap.exists()) {
          return showToast("ოთახი ამ კოდით ვერ მოიძებნა");
        }

        const data = snap.data();
        if (data.player2 && data.player2 !== currentUser.uid) {
          return showToast("ოთახი უკვე სავსეა");
        }

        playerRole = (data.player1 === currentUser.uid) ? 'player1' : 'player2';

        if (playerRole === 'player2') {
          await updateDoc(ref, {
            player2: currentUser.uid,
            status: 'playing'
          });
        }

        listenToRoom(roomCode);
      } catch (err) {
        console.error("Error joining room:", err);
        showToast("ოთახში შესვლა ვერ მოხერხდა");
      }
    };

    // Listen for Realtime Changes from Firestore
    function listenToRoom(code) {
      if (roomUnsubscribe) roomUnsubscribe();

      roomUnsubscribe = onSnapshot(getRoomRef(code), (snapshot) => {
        if (!snapshot.exists()) return;
        gameState = snapshot.data();
        updateUI(gameState);
      }, (err) => {
        console.error("Snapshot error:", err);
      });
    }

    // Render UI state based on database updates
    function updateUI(state) {
      if (state.status === 'waiting') {
        switchScreen('waiting-screen');
        return;
      }

      switchScreen('game-screen');

      // Score Update
      document.getElementById('p1-score').innerText = `${state.p1Score} ქულა`;
      document.getElementById('p2-score').innerText = `${state.p2Score} ქულა`;

      // Highlight Player Cards
      const p1Card = document.getElementById('p1-card');
      const p2Card = document.getElementById('p2-card');

      if (playerRole === 'player1') {
        document.getElementById('p1-label').innerText = "შენ (მოთამაშე 1)";
        document.getElementById('p2-label').innerText = "მოწინააღმდეგე";
      } else {
        document.getElementById('p1-label').innerText = "მოწინააღმდეგე";
        document.getElementById('p2-label').innerText = "შენ (მოთამაშე 2)";
      }

      // Turn logic
      const isMyTurn = (state.currentTurn === playerRole);
      const turnBanner = document.getElementById('turn-banner');

      if (isMyTurn) {
        turnBanner.innerText = "შენი სვლაა!";
        turnBanner.className = "text-sm md:text-base font-bold text-emerald-400 animate-pulse";
      } else {
        turnBanner.innerText = "მოწინააღმდეგის სვლაა...";
        turnBanner.className = "text-sm md:text-base font-bold text-slate-400";
      }

      // Render Active Card details
      const maskedDisplay = document.getElementById('masked-word-display');
      const categoryDisplay = document.getElementById('word-category-display');
      const guessControls = document.getElementById('guess-controls');

      if (state.activeCardId !== null && state.cards[state.activeCardId]) {
        const activeCard = state.cards[state.activeCardId];
        maskedDisplay.innerText = activeCard.masked;
        categoryDisplay.innerText = `კატეგორია: ${activeCard.category}`;

        if (isMyTurn && !activeCard.isGuessed) {
          guessControls.classList.remove('hidden');
        } else {
          guessControls.classList.add('hidden');
        }
      } else {
        maskedDisplay.innerText = "აირჩიეთ ბარათი ქვემოთ";
        categoryDisplay.innerText = "";
        guessControls.classList.add('hidden');
      }

      // Render Cards Grid
      const grid = document.getElementById('cards-grid');
      grid.innerHTML = '';

      state.cards.forEach((card) => {
        const btn = document.createElement('button');
        btn.disabled = !isMyTurn || card.isGuessed;

        let bgColor = "bg-slate-800/90 border-slate-700 hover:border-indigo-500";
        let statusIcon = '<i class="fa-solid fa-lock text-slate-500"></i>';

        if (card.isGuessed) {
          bgColor = card.guessedBy === playerRole 
            ? "bg-emerald-900/40 border-emerald-500 text-emerald-300" 
            : "bg-rose-900/40 border-rose-500 text-rose-300";
          statusIcon = card.guessedBy === playerRole 
            ? '<i class="fa-solid fa-circle-check text-emerald-400"></i>' 
            : '<i class="fa-solid fa-circle-xmark text-rose-400"></i>';
        } else if (state.activeCardId === card.id) {
          bgColor = "bg-indigo-900/60 border-indigo-400 ring-2 ring-indigo-500";
          statusIcon = '<i class="fa-solid fa-eye text-indigo-300"></i>';
        }

        btn.className = `card-tile p-4 rounded-2xl border flex flex-col items-center justify-center space-y-2 text-center min-h-[100px] ${bgColor} ${(!isMyTurn || card.isGuessed) ? 'cursor-not-allowed opacity-80' : 'cursor-pointer'}`;
        btn.onclick = () => selectCard(card.id);

        btn.innerHTML = `
          <div class="text-xs uppercase tracking-wider text-slate-400 font-medium">${card.category}</div>
          <div class="text-xl font-mono font-bold">${card.isGuessed ? card.word : card.masked}</div>
          <div>${statusIcon}</div>
        `;

        grid.appendChild(btn);
      });
    }

    // Select a card from grid
    window.selectCard = async function(cardId) {
      if (!gameState || gameState.currentTurn !== playerRole) return;
      if (gameState.cards[cardId].isGuessed) return;

      try {
        await updateDoc(getRoomRef(roomCode), {
          activeCardId: cardId
        });
      } catch (err) {
        console.error("Error selecting card:", err);
      }
    };

    // Submit word guess
    window.submitGuess = async function() {
      if (!gameState || gameState.currentTurn !== playerRole) return;
      if (gameState.activeCardId === null) return;

      const input = document.getElementById('guess-input');
      const guess = input.value.trim().toLowerCase();
      input.value = '';

      if (!guess) return showToast("ჩაწერეთ სიტყვა!");

      const activeCard = gameState.cards[gameState.activeCardId];
      const targetWord = activeCard.word.toLowerCase();
      
      const isCorrect = (guess === targetWord);

      const updatedCards = [...gameState.cards];
      let newP1Score = gameState.p1Score;
      let newP2Score = gameState.p2Score;

      if (isCorrect) {
        // სრულიად სწორი სიტყვა
        updatedCards[gameState.activeCardId].isGuessed = true;
        updatedCards[gameState.activeCardId].guessedBy = playerRole;
        if (playerRole === 'player1') newP1Score += 10;
        else newP2Score += 10;
        showToast("სწორია! +10 ქულა 🎉");
      } else {
        // თუ მთლიანი სიტყვა არ არის სწორი, ვამოწმებთ რომელი ასოები დაემთხვა
        // (ვქმნით ან ვანახლებთ გამოცნობილი ასოების ნიღაბს/მასკას ბარათში)
        let currentMask = activeCard.guessedMask || "_".repeat(targetWord.length);
        let newMaskArray = currentMask.split("");
        
        let matchedAny = false;
        for (let i = 0; i < targetWord.length; i++) {
          // თუ შეტანილი სიტყვის რომელიმე ასო ემთხვევა მიზნობრივი სიტყვის ასოს
          if (i < guess.length && guess[i] === targetWord[i]) {
            newMaskArray[i] = targetWord[i]; // ვტოვებთ/ვხსნით ამ ასოს
            matchedAny = true;
          }
        }
        
        updatedCards[gameState.activeCardId].guessedMask = newMaskArray.join("");
        
        if (matchedAny) {
          showToast("ნაწილობრივ სწორია! სვლა გადადის 🔄");
        } else {
          showToast("არასწორია! სვლა გადადის ❌");
        }
      }

      // Next Turn (სვლის გადართვა მეორე მოთამაშეზე)
      const nextTurn = (playerRole === 'player1') ? 'player2' : 'player1';

      try {
        await updateDoc(getRoomRef(roomCode), {
          cards: updatedCards,
          p1Score: newP1Score,
          p2Score: newP2Score,
          currentTurn: nextTurn,
          activeCardId: null // სვლის დასრულებისას აქტიური ბარათი იხურება
        });
      } else {
        // თუ გინდათ, რომ აქტიური ბარათი არ დაიხუროს არასწორი ცდისას, 
        // activeCardId: null-ის მაგივრად შეგიძლია იგივე დატოვო, მაგრამ რადგან სვლა გადადის, 
        // ჯობია ახალმა მოთამაშემ აირჩიოს, ან შენი ლოგიკის მიხედვით მიუსადაგო.
      } catch (err) {
        console.error("Error submitting guess:", err);
      }
    };
    // Copy room code to clipboard
    window.copyRoomCode = function() {
      if (!roomCode) return;
      navigator.clipboard.writeText(roomCode);
      showToast("კოდი დაკოპირებულია!");
    };

    // Reset game state for room
    window.resetGame = async function() {
      if (!roomCode) return;
      const shuffled = [...WORDS_LIST].sort(() => 0.5 - Math.random());
      const selectedWords = shuffled.slice(0, 8);

      const cards = selectedWords.map((item, index) => ({
        id: index,
        word: item.word,
        category: item.category,
        masked: maskWord(item.word),
        isRevealed: false,
        isGuessed: false,
        guessedBy: null
      }));

      try {
        await updateDoc(getRoomRef(roomCode), {
          cards: cards,
          p1Score: 0,
          p2Score: 0,
          currentTurn: 'player1',
          activeCardId: null
        });
        showToast("თამაში განახლდა!");
      } catch (err) {
        console.error("Error resetting game:", err);
      }
    };

    // Screen Switching Helper
    function switchScreen(screenId) {
      document.getElementById('lobby-screen').classList.add('hidden');
      document.getElementById('waiting-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.add('hidden');

      document.getElementById(screenId).classList.remove('hidden');
    }

  </script>
</body>
</html>
